<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.H.O.P</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 4px;
            z-index: 1000;
            pointer-events: none;
            line-height: 1.5;
        }
        #arms-controls {
            position: fixed;
            top: 10px;
            right: 10px;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 4px;
            z-index: 1000;
            pointer-events: auto;
            min-width: 250px;
        }
        #arms-controls h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 14px;
        }
        #lighting-controls {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 4px;
            z-index: 1000;
            pointer-events: auto;
            min-width: 260px;
        }
        #lighting-controls h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 14px;
        }
        #lighting-controls .slider-group {
            margin-bottom: 12px;
        }
        #lighting-controls label {
            display: block;
            margin-bottom: 4px;
            color: #00ff00;
        }
        #lighting-controls input[type="range"] {
            width: 100%;
            margin-bottom: 2px;
        }
        #lighting-controls .value {
            display: inline-block;
            margin-left: 8px;
            color: #ffff00;
            font-weight: bold;
        }
        #arms-controls .slider-group {
            margin-bottom: 12px;
        }
        #arms-controls label {
            display: block;
            margin-bottom: 4px;
            color: #00ff00;
        }
        #arms-controls input[type="range"] {
            width: 100%;
            margin-bottom: 2px;
        }
        #arms-controls .value {
            display: inline-block;
            margin-left: 8px;
            color: #ffff00;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="debug-info">
        <div id="fps-counter">FPS: --</div>
        <div id="coords-display">Pos: (0.00, 0.00, 0.00)</div>
        <div id="camera-tracker">Camera: (0.00, 0.00, 0.00)</div>
        <div id="speed-display">Speed: 0.00 u/s</div>
        <div id="grounded-display">Grounded: --</div>
    </div>
    <div id="arms-controls">
        <h3>Arms Position Controls</h3>
        <div class="slider-group">
            <label>
                Forward Offset: 
                <span class="value" id="forward-value">0</span>
            </label>
            <input type="range" id="forward-slider" min="-2" max="2" step="0.01" value="0">
        </div>
        <div class="slider-group">
            <label>
                Right Offset: 
                <span class="value" id="right-value">0</span>
            </label>
            <input type="range" id="right-slider" min="-2" max="2" step="0.01" value="0">
        </div>
        <div class="slider-group">
            <label>
                Up Offset: 
                <span class="value" id="up-value">-1.64</span>
            </label>
            <input type="range" id="up-slider" min="-2" max="2" step="0.01" value="-1.64">
        </div>
    </div>
    <div id="lighting-controls">
        <h3>Lighting</h3>
        <div class="slider-group">
            <label>
                Light Direction X: <span class="value" id="lightDirX-value">0.16</span>
            </label>
            <input type="range" id="lightDirX-slider" min="-1" max="1" step="0.01" value="0.16">
        </div>
        <div class="slider-group">
            <label>
                Light Direction Y: <span class="value" id="lightDirY-value">1.00</span>
            </label>
            <input type="range" id="lightDirY-slider" min="-1" max="1" step="0.01" value="1">
        </div>
        <div class="slider-group">
            <label>
                Light Direction Z: <span class="value" id="lightDirZ-value">-0.11</span>
            </label>
            <input type="range" id="lightDirZ-slider" min="-1" max="1" step="0.01" value="-0.11">
        </div>
        <div class="slider-group">
            <label>
                Light Intensity: <span class="value" id="lightIntensity-value">0.87</span>
            </label>
            <input type="range" id="lightIntensity-slider" min="0" max="3" step="0.01" value="0.87">
        </div>
        <div class="slider-group">
            <label>
                Ambient Intensity: <span class="value" id="ambient-value">0.74</span>
            </label>
            <input type="range" id="ambient-slider" min="0" max="1" step="0.01" value="0.74">
        </div>
        <div class="slider-group">
            <label>
                Shininess: <span class="value" id="shininess-value">4</span>
            </label>
            <input type="range" id="shininess-slider" min="4" max="256" step="1" value="4">
        </div>
    </div>
    <canvas id="gfx-main"></canvas>
    <script src="dist/main.js"></script>
</body>
</html>
