<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.H.O.P</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 4px;
            z-index: 1000;
            pointer-events: none;
            line-height: 1.5;
        }
        #arms-controls {
            position: fixed;
            top: 10px;
            right: 10px;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 4px;
            z-index: 1000;
            pointer-events: auto;
            min-width: 250px;
        }
        #arms-controls h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 14px;
        }
        #lighting-controls {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 4px;
            z-index: 1000;
            pointer-events: auto;
            min-width: 260px;
        }
        #lighting-controls h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 14px;
        }
        #lighting-controls .slider-group {
            margin-bottom: 12px;
        }
        #lighting-controls label {
            display: block;
            margin-bottom: 4px;
            color: #00ff00;
        }
        #lighting-controls input[type="range"] {
            width: 100%;
            margin-bottom: 2px;
        }
        #lighting-controls .value {
            display: inline-block;
            margin-left: 8px;
            color: #ffff00;
            font-weight: bold;
        }
        #arms-controls .slider-group {
            margin-bottom: 12px;
        }
        #arms-controls label {
            display: block;
            margin-bottom: 4px;
            color: #00ff00;
        }
        #arms-controls input[type="range"] {
            width: 100%;
            margin-bottom: 2px;
        }
        #arms-controls .value {
            display: inline-block;
            margin-left: 8px;
            color: #ffff00;
            font-weight: bold;
        }
        #postfx-controls {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 4px;
            z-index: 1000;
            pointer-events: auto;
            min-width: 280px;
        }
        #postfx-controls h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
            font-size: 14px;
        }
        #postfx-controls .slider-group {
            margin-bottom: 12px;
        }
        #postfx-controls label {
            display: block;
            margin-bottom: 4px;
            color: #00ff00;
        }
        #postfx-controls input[type="range"] {
            width: 100%;
            margin-bottom: 2px;
        }
        #postfx-controls .value {
            display: inline-block;
            margin-left: 8px;
            color: #ffff00;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="main-menu">
        <div id="map-select-screen" class="menu-screen active">
            <div id="map-select-container">
                <img src="src/assets/images/logo.png" alt="B.H.O.P" class="menu-logo">
                <h2>Selecione o Mapa</h2>
                <div id="map-list">
                    <div class="map-card" data-map="Bhop_Seal">
                        <div class="map-name">Bhop Seal</div>
                        <div class="map-desc">Mapa clássico</div>
                    </div>
                    <div class="map-card" data-map="Bhop_XMas">
                        <div class="map-name">Bhop XMas</div>
                        <div class="map-desc">Mapa de Natal</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="skin-select-screen" class="menu-screen">
            <div id="skin-select-container">
                <img src="src/assets/images/logo.png" alt="B.H.O.P" class="menu-logo">
                <h2>Selecione o Personagem</h2>
                <div id="skin-list">
                    <div class="skin-card" data-skin="Arctic_T">
                        <div class="skin-name">Arctic T</div>
                        <div class="skin-desc">Terrorista</div>
                    </div>
                    <div class="skin-card" data-skin="CT">
                        <div class="skin-name">Urban CT</div>
                        <div class="skin-desc">Counter-Terrorista</div>
                    </div>
                </div>
                <button id="back-to-maps" class="menu-button">← Voltar</button>
            </div>
        </div>

        <div id="loading-indicator" style="display: none;">
            <div class="loading-text">Carregando...</div>
        </div>
    </div>
    <style>
        #main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('src/assets/images/background.png') center center / cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        #main-menu.hidden {
            display: none;
        }
        .menu-screen {
            display: none;
            text-align: center;
            color: #fff;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .menu-screen.active {
            display: block;
        }
        .menu-logo {
            max-width: 300px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px #00ff00);
        }
        #map-select-container h2,
        #skin-select-container h2 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #aaa;
        }
        #map-list {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .map-card {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 30px 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
        }
        .map-card:hover {
            background: rgba(0, 255, 0, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }
        .map-card .map-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #00ff00;
        }
        .map-card .map-desc {
            font-size: 14px;
            color: #888;
        }
        #skin-list {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .skin-card {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 30px 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
        }
        .skin-card:hover {
            background: rgba(0, 255, 0, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }
        .skin-name {
            font-size: 24px;
            font-weight: bold;
            color: #00ff00;
            margin-bottom: 10px;
        }
        .skin-desc {
            font-size: 14px;
            color: #888;
        }
        .menu-button {
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #00ff00;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 16px;
            padding: 10px 30px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .menu-button:hover {
            background: rgba(0, 255, 0, 0.4);
        }
        #loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .loading-text {
            font-size: 18px;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', monospace;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>

    <div id="debug-info">
        <div id="fps-counter">FPS: --</div>
        <div id="coords-display">Pos: (0.00, 0.00, 0.00)</div>
        <div id="camera-tracker">Camera: (0.00, 0.00, 0.00)</div>
        <div id="speed-display">Speed: 0.00 u/s</div>
        <div id="grounded-display">Grounded: --</div>
    </div>
    <div id="arms-controls">
        <h3>Arms Position Controls</h3>
        <div class="slider-group">
            <label>
                Forward Offset: 
                <span class="value" id="forward-value">0</span>
            </label>
            <input type="range" id="forward-slider" min="-2" max="2" step="0.01" value="0">
        </div>
        <div class="slider-group">
            <label>
                Right Offset: 
                <span class="value" id="right-value">0</span>
            </label>
            <input type="range" id="right-slider" min="-2" max="2" step="0.01" value="0">
        </div>
        <div class="slider-group">
            <label>
                Up Offset: 
                <span class="value" id="up-value">-1.85</span>
            </label>
            <input type="range" id="up-slider" min="-2" max="2" step="0.01" value="-1.85">
        </div>
    </div>
    <div id="lighting-controls">
        <h3>Lighting</h3>
        <div class="slider-group">
            <label>
                Light Direction X: <span class="value" id="lightDirX-value">0.16</span>
            </label>
            <input type="range" id="lightDirX-slider" min="-1" max="1" step="0.01" value="0.16">
        </div>
        <div class="slider-group">
            <label>
                Light Direction Y: <span class="value" id="lightDirY-value">1.00</span>
            </label>
            <input type="range" id="lightDirY-slider" min="-1" max="1" step="0.01" value="1">
        </div>
        <div class="slider-group">
            <label>
                Light Direction Z: <span class="value" id="lightDirZ-value">-0.11</span>
            </label>
            <input type="range" id="lightDirZ-slider" min="-1" max="1" step="0.01" value="-0.11">
        </div>
        <div class="slider-group">
            <label>
                Light Intensity: <span class="value" id="lightIntensity-value">0.87</span>
            </label>
            <input type="range" id="lightIntensity-slider" min="0" max="3" step="0.01" value="0.87">
        </div>
        <div class="slider-group">
            <label>
                Ambient Intensity: <span class="value" id="ambient-value">0.74</span>
            </label>
            <input type="range" id="ambient-slider" min="0" max="1" step="0.01" value="0.74">
        </div>
        <div class="slider-group">
            <label>
                Shininess: <span class="value" id="shininess-value">4</span>
            </label>
            <input type="range" id="shininess-slider" min="4" max="256" step="1" value="4">
        </div>
    </div>
    <div id="postfx-controls">
        <h3>CRT / Fisheye</h3>
        <div class="slider-group">
            <label>Fisheye Strength: <span class="value" id="fisheye-value">1.00</span></label>
            <input type="range" id="fisheye-slider" min="0" max="2" step="0.01" value="1.0">
        </div>
        <div class="slider-group">
            <label>Scanline Intensity: <span class="value" id="scanline-value">0.025</span></label>
            <input type="range" id="scanline-slider" min="0" max="0.5" step="0.001" value="0.025">
        </div>
        <div class="slider-group">
            <label>RGB Offset: <span class="value" id="rgbOffset-value">0.0018</span></label>
            <input type="range" id="rgbOffset-slider" min="0" max="0.01" step="0.0001" value="0.0018">
        </div>
        <div class="slider-group">
            <label>Vignette Intensity: <span class="value" id="vignette-value">0.03</span></label>
            <input type="range" id="vignette-slider" min="0" max="1" step="0.01" value="0.03">
        </div>
        <div class="slider-group">
            <label>Wave Amplitude: <span class="value" id="waveAmp-value">0.0002</span></label>
            <input type="range" id="waveAmp-slider" min="0" max="0.005" step="0.0001" value="0.0002">
        </div>
        <div class="slider-group">
            <label>Wave Frequency: <span class="value" id="waveFreq-value">14.70</span></label>
            <input type="range" id="waveFreq-slider" min="0" max="20" step="0.1" value="14.7">
        </div>
        <div class="slider-group">
            <label>Jitter Intensity: <span class="value" id="jitter-value">0.0000</span></label>
            <input type="range" id="jitter-slider" min="0" max="0.005" step="0.0001" value="0.0000">
        </div>
    </div>
    <canvas id="gfx-main"></canvas>
    <script src="dist/main.js"></script>
</body>
</html>
